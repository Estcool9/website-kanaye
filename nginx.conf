server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/pdf;
    gzip_min_length 512;

    # Site à une seule page : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les fichiers statiques versionnés (images, css, js)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Ne pas mettre en cache le HTML, pour que les mises à jour du site
    # soient visibles immédiatement après un redéploiement
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
